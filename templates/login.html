<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Poker Tracker</title>
  <meta name="description" content="Sign in to Poker Tracker with your Google account to track your sessions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(212,168,67,0.07) 0%, transparent 70%),
        var(--color-bg);
      position: relative;
      overflow: hidden;
    }

    /* Floating background card suits */
    .login-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .login-bg span {
      position: absolute;
      font-family: var(--font-display);
      font-weight: 700;
      color: rgba(212, 168, 67, 0.04);
      user-select: none;
      animation: floatCard 10s ease-in-out infinite;
    }
    .login-bg .s1 { font-size: 12rem; top: -5%; left: -3%; animation-delay: 0s; }
    .login-bg .s2 { font-size: 9rem;  top: 60%; right: -2%; animation-delay: 2s; animation-duration: 14s; }
    .login-bg .s3 { font-size: 7rem;  bottom: 5%; left: 30%; animation-delay: 1s; animation-duration: 12s; }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 52px 44px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
      position: relative;
      animation: fadeIn 0.5s ease both;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,168,67,0.5), transparent);
    }

    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .login-brand-icon {
      font-size: 2.2rem;
      color: var(--color-gold);
      line-height: 1;
    }

    .login-brand-text {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.02em;
    }

    .login-brand-accent { color: var(--color-gold); }

    .login-heading {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 8px;
    }

    .login-subheading {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      border-radius: var(--radius-md);
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-google:hover {
      background: rgba(212,168,67,0.07);
      border-color: var(--color-gold-dim);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .btn-google:active { transform: translateY(0); }

    .google-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .login-footer-text {
      margin-top: 28px;
      font-size: 0.78rem;
      color: var(--color-text-dim);
      line-height: 1.6;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--color-text-dim);
      font-size: 0.78rem;
    }
    .login-divider::before, .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }
  </style>
</head>
<body>
  <div class="login-page">
    <!-- Background decoration -->
    <div class="login-bg" aria-hidden="true">
      <span class="s1">♠</span>
      <span class="s2">♦</span>
      <span class="s3">♣</span>
    </div>

    <div class="login-card">
      <!-- Brand -->
      <div class="login-brand">
        <span class="login-brand-icon">♠</span>
        <span class="login-brand-text">Poker<span class="login-brand-accent">Tracker</span></span>
      </div>

      <h1 class="login-heading">Welcome back</h1>
      <p class="login-subheading">Sign in to track your sessions, view analytics, and monitor your profits.</p>

      <!-- Google Sign In -->
      <a href="{{ url_for('auth.auth_login') }}" class="btn-google" id="btn-google-signin">
        <!-- Google logo SVG -->
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </a>

      <p class="login-footer-text">
        By signing in you agree to keep your poker data private and secure.<br/>
        Each Google account has its own separate session history.
      </p>
    </div>
  </div>
</body>
</html>
